<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaje al Mictlán · Día de Muertos</title>

<meta property="og:description" content="Escape room de español: abre las cinco puertas del Mictlán. Niveles A1 y A2–B1.">

<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8203F; --red-d:#A3172F; --blue:#B3D1ED; --blue-l:#DCEAF7; --bg:#F3F7FB;
  --ink:#1F2433; --muted:#5B6478; --card:#FFFFFF; --line:#D5E2F0;
  --marigold:#F5A300; --orange:#E8730C; --purple:#6F48A8; --magenta:#D6336C; --teal:#1F8A82;
  --ok:#1E8E5A; --ok-bg:#E3F5EC; --warn:#B86E00; --warn-bg:#FFF2D9; --bad:#C8203F; --bad-bg:#FBE4E8;
  --r:16px; --shadow:0 2px 0 rgba(31,36,51,.06), 0 8px 24px rgba(31,36,51,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2rem,7vw,3.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* papel picado */
.picado{display:block;width:100%;height:64px}
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.bar{max-width:820px;margin:0 auto;padding:6px 16px 8px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--red);font-weight:700;letter-spacing:.02em;white-space:nowrap}
.doors{display:flex;gap:6px}
.door-dot{width:30px;height:36px;border-radius:15px 15px 4px 4px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.85rem;color:var(--muted)}
.door-dot.open{background:var(--marigold);border-color:var(--orange);color:#fff}
.door-dot.now{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,32,63,.15)}
.clock{font-family:"JetBrains Mono",monospace;font-size:.9rem;color:var(--muted);white-space:nowrap}
.hidden{display:none!important}

main{max-width:820px;margin:0 auto;padding:8px 16px 140px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin:0 0 18px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px}

/* hero */
.hero{border-radius:22px;overflow:hidden;position:relative;margin:0 0 18px;box-shadow:var(--shadow);background:#2B1B3F}
.hero .pic{aspect-ratio:16/9;border-radius:0}
.hero .pic .fb{font-size:4.5rem;background:radial-gradient(circle at 30% 30%,#F5A300 0,#E8730C 25%,#6F48A8 70%,#2B1B3F 100%)}

/* pictures with fallback */
.pic{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--blue-l)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .fb{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;background:linear-gradient(135deg,var(--blue-l),#fff 60%,#FFE7B8)}

/* xolo speech */
.xolo{display:flex;gap:14px;align-items:flex-start}
.xolo .ava{flex:0 0 72px;width:72px;height:72px;border-radius:50%;aspect-ratio:1/1;border:3px solid var(--marigold)}
.xolo .ava .fb{font-size:2.2rem}
.bubble{background:var(--blue-l);border-radius:4px 16px 16px 16px;padding:12px 16px;flex:1}
.bubble b{color:var(--red)}

/* level choice */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.lvl{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;transition:.15s}
.lvl strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem}
.lvl span{font-size:.92rem;color:var(--muted)}
.lvl.sel{border-color:var(--red);background:#FFF5F7;box-shadow:0 0 0 3px rgba(200,32,63,.12)}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input.txt{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input.txt:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(179,209,237,.6)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;font-weight:700;font-size:1.02rem;background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.gold{background:var(--marigold);box-shadow:0 3px 0 var(--orange);color:#2B1B00}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.small{font-size:.9rem;color:var(--muted)}
.fb-line{margin-top:12px;font-weight:600;min-height:1.4em}
.fb-line.ok{color:var(--ok)} .fb-line.bad{color:var(--bad)} .fb-line.warn{color:var(--warn)}
.hintbox{margin-top:12px;background:var(--warn-bg);border-left:4px solid var(--marigold);padding:10px 14px;border-radius:8px;font-size:.98rem}

/* reading */
details.reading{background:#FFFBF2;border:1px solid #F3DDB0;border-radius:14px;padding:4px 18px;margin:0 0 16px}
details.reading summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--orange)}
details.reading .rtext p{margin:0 0 .75em}
.reading .rimg{max-width:420px;margin:4px auto 14px}
.reading .rimg .pic{aspect-ratio:4/3}
.tri{display:grid;gap:12px;margin-bottom:8px}
.tri h3{color:var(--purple);margin-bottom:.25em}

/* choice */
.items{display:grid;gap:12px}
.item{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;transition:border-color .15s}
.item .q{font-weight:600;margin-bottom:8px}
.item .num{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:.85rem;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.95rem;color:var(--ink)}
.opt.sel{background:var(--blue);border-color:#7FAFD9}
.item.ok{border-color:var(--ok);background:var(--ok-bg)}
.item.ok .opt.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.item.warn{border-color:var(--marigold);background:var(--warn-bg)}
.item.ok .opt{pointer-events:none}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.flip{perspective:900px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;transition:transform .45s;transform-style:preserve-3d;min-height:220px}
.flip.on .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column}
.flip .face .pic{aspect-ratio:1/1;flex:0 0 auto}
.flip .face .w{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.02rem;margin-top:8px;text-align:center}
.flip .back{transform:rotateY(180deg);background:var(--blue-l);justify-content:center}
.flip .back .w{color:var(--red);margin:0 0 6px}
.flip .back p{font-size:.95rem;margin:0;text-align:center}
.flip.seen .front{outline:3px solid var(--marigold);outline-offset:-3px}

/* typed */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.titem{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.titem .pic{aspect-ratio:16/10;max-height:170px;margin-bottom:8px}
.titem .clue{font-size:.98rem;margin-bottom:8px}
.titem .pat{font-family:"JetBrains Mono",monospace;font-size:.85rem;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.ans{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ans .art{font-weight:700;color:var(--muted)}
.ans input{flex:1;min-width:120px}
.titem.ok{border-color:var(--ok);background:var(--ok-bg)}
.titem.bad{border-color:var(--bad);background:var(--bad-bg)}
.titem.warn{border-color:var(--marigold);background:var(--warn-bg)}
.note{font-size:.85rem;font-weight:600;margin-top:6px}
.note.warn{color:var(--warn)} .note.bad{color:var(--bad)}

/* gaps */
.gaptext{line-height:2.4;font-size:1.06rem}
.gap{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.gap input{font:inherit;font-size:1rem;padding:4px 8px;border:2px solid var(--line);border-bottom-width:3px;border-radius:8px;background:#fff;color:var(--ink);outline:none;width:9ch;text-align:center}
.gap input:focus{border-color:#7FAFD9}
.gap .inf{color:var(--purple);font-style:italic;font-size:.95rem}
.gap.ok input{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.gap.bad input{border-color:var(--bad);background:var(--bad-bg)}
.gap.warn input{border-color:var(--marigold);background:var(--warn-bg)}
.gap .n{font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--muted);vertical-align:super}

/* order */
.seq,.pool{display:grid;gap:8px}
.seq{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:12px;background:#fff}
.seq:empty::before{content:"Toca las frases en el orden correcto…";color:var(--muted);font-style:italic}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-size:1rem;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.chip .k{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--red);min-width:1.4em}
.pool .chip{background:var(--bg)}
.chip.ok{border-color:var(--ok);background:var(--ok-bg);pointer-events:none}
.chip.flash{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* door transitions */
.unlock{text-align:center}
.bigletter{display:inline-grid;place-items:center;width:110px;height:130px;border-radius:55px 55px 12px 12px;background:var(--marigold);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-size:4.2rem;font-weight:800;box-shadow:0 6px 0 var(--orange);margin:6px 0 16px;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 16px}
.letters span{width:52px;height:60px;border-radius:26px 26px 8px 8px;background:var(--marigold);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.8rem;box-shadow:0 4px 0 var(--orange)}

/* certificate */
.cert{border:3px solid var(--marigold);border-radius:20px;padding:26px 20px;text-align:center;background:linear-gradient(180deg,#FFF8E8,#fff 50%)}
.cert .who{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.8rem;color:var(--red);margin:6px 0}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.stat b{display:block;font-family:"JetBrains Mono",monospace;font-size:1.2rem}
.speak{display:grid;gap:12px}
.speak .sq{background:#fff;border-left:5px solid var(--purple);border-radius:10px;padding:12px 14px}
.speak .sq b{display:block;margin-bottom:4px}
.speak .sq span{color:var(--muted);font-size:.95rem}
.poem{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;background:var(--blue-l);border-radius:14px;padding:16px 20px;line-height:1.6;margin:10px 0}

/* accent bar */
.accents{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(31,36,51,.08)}
.accents button{min-width:42px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-size:1.15rem;font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
.accents button:active{background:var(--blue)}
footer{text-align:center;font-size:.8rem;color:var(--muted);padding:10px 16px 30px}
@media (max-width:520px){
  body{font-size:17px}
  .card{padding:18px 16px}
  .levels{grid-template-columns:1fr}
  .bar{gap:8px}
  .brand{display:none}
  .door-dot{width:26px;height:32px;font-size:.78rem}
  .cards{grid-template-columns:repeat(2,1fr)}
  .flip .in{min-height:210px}
  .xolo .ava{flex-basis:56px;width:56px;height:56px}
  .accents{gap:4px;padding-left:6px;padding-right:6px}
  .accents button{min-width:34px;height:42px;padding:0;font-size:1.05rem}
  .gaptext{line-height:2.2}
  .gap input{padding:2px 6px}
}
</style>
</head>

    <span class="clock" id="clock">00:00</span>

var LEVELS = {
a1: {
  label:'A1',
  intro:'¡Hola! Me llamo <b>Xolo</b>. Soy un perro xoloitzcuintle y vivo en el <b>Mictlán</b>, el mundo de los muertos de los antiguos mexicas. Es la noche del 1 de noviembre: las almas visitan a sus familias, pero el camino está oscuro. ¿Me ayudas? Hay <b>cinco puertas</b>. Detrás de cada puerta hay una letra. Con las cinco letras formas la <b>palabra secreta</b>.',

/* ============================================================
   UTILIDADES
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function norm(s){ return String(s||'').toLowerCase().replace(/[’`´]/g,"'").replace(/[«»"“”.,;:!¡?¿]/g,' ').replace(/\s+/g,' ').trim(); }
function bare(s){ return norm(s).normalize('NFD').replace(/[̀-ͯ]/g,''); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function stripArt(s){ return s.replace(/^(el|la|los|las|un|una|unos|unas) /,''); }
// devuelve 'ok' | 'warn' (solo tildes) | 'bad'
function judge(val, answers, allowArt){
  var v=norm(val); if(!v) return 'bad';
  var list=[]; answers.forEach(function(a){ list.push(norm(a)); });
  if(allowArt){ v=stripArt(v); list=list.map(stripArt); }
  if(list.indexOf(v)>-1) return 'ok';
  var vb=bare(v), lb=list.map(function(a){return a.normalize('NFD').replace(/[̀-ͯ]/g,'');});
  if(lb.indexOf(vb)>-1) return 'warn';
  return 'bad';
}
function pattern(word){ return word.split(' ').map(function(w){ return w.charAt(0)+' '+Array(w.length).join('_ ').trim(); }).join('   '); }
function fmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); var m=Math.floor(s/60); s=s%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

/* imagen con alternativa si el archivo no existe */
function pic(src, emoji, cls){
  var d=el('div','pic'+(cls?' '+cls:''));
  var fb=el('div','fb',emoji||'🌼');
  if(src){
    var im=new Image(); im.alt=''; im.loading='lazy'; im.decoding='async';
    im.onerror=function(){ if(im.parentNode) im.parentNode.removeChild(im); d.appendChild(fb); };
    im.src=src; d.appendChild(im);
  } else d.appendChild(fb);
  return d;
}

   ============================================================ */
var accents=document.getElementById('accents'), lastInput=null, lastSel=[0,0];
['á','é','í','ó','ú','ñ','ü','¿','¡'].forEach(function(ch){
  var b=el('button',null,ch); b.type='button'; b.tabIndex=-1;
  var ins=function(e){ e.preventDefault(); insertChar(ch); };
  b.addEventListener('touchstart',ins,{passive:false});
  b.addEventListener('mousedown',ins);
  b.addEventListener('click',function(e){ e.preventDefault(); });
  accents.appendChild(b);
});
function track(inp){
  var upd=function(){ lastInput=inp; try{ lastSel=[inp.selectionStart, inp.selectionEnd]; }catch(e){} };
  ['focus','keyup','click','input','select','touchend'].forEach(function(ev){ inp.addEventListener(ev,upd); });
}
function insertChar(ch){
  var inp=(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('ac'))?document.activeElement:lastInput;
  if(!inp || inp.disabled || !document.body.contains(inp)) return;
  var s,e;
  if(document.activeElement===inp){ s=inp.selectionStart; e=inp.selectionEnd; }
  else { s=lastSel[0]; e=lastSel[1]; }
  if(s==null){ s=e=inp.value.length; }
  inp.focus({preventScroll:true});
  try{ inp.setRangeText(ch,s,e,'end'); }
  catch(err){ inp.value=inp.value.slice(0,s)+ch+inp.value.slice(e); inp.selectionStart=inp.selectionEnd=s+ch.length; }
  lastInput=inp; lastSel=[inp.selectionStart, inp.selectionEnd];
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}
function showAccents(on){ accents.classList.toggle('hidden',!on); }
function mkInput(cls, w){
  var i=el('input',cls); i.type='text'; i.className=(cls||'')+' ac';
  i.setAttribute('autocomplete','off'); i.setAttribute('autocorrect','off'); i.setAttribute('autocapitalize','off'); i.setAttribute('spellcheck','false');
  if(w) i.style.width=w;
  track(i); return i;
}

/* lectura (texto o tres textos); devuelve lista de huecos si tiene [[n]] */
function readingBlock(R, gapPart, door){
  var d=el('details','reading'); d.open=true;
  d.appendChild(el('summary',null,'📜 '+esc(R.title)));
  var body=el('div','rtext');
  var gapEls=[];
  if(R.note) body.appendChild(el('p','small',R.note));
  if(R.html){
    if(R.img){ var w=el('div','rimg'); w.appendChild(pic(R.img,R.emoji)); body.appendChild(w); }
    body.insertAdjacentHTML('beforeend',R.html);
  }
  if(R.tri){
    var t=el('div','tri');
    R.tri.forEach(function(x){
      var b=el('div');
      if(x.img){ var tp=pic(x.img,x.emoji); tp.style.aspectRatio='16/7'; tp.style.marginBottom='10px'; b.appendChild(tp); }
      b.appendChild(el('h3',null,esc(x.h)));
      var p=el('p',gapPart?'gaptext':null);
      if(gapPart){ fillGaps(p, x.p, gapPart, gapEls); }
      else {
        var gp=null; (door&&door.parts||[]).forEach(function(pp){ if(pp.inReading) gp=pp; });
        p.innerHTML=esc(x.p).replace(/\[\[(\d+)\]\]/g,function(m,n){ return gp?'<b style="color:var(--ok)">'+esc(gp.gaps[+n].a[0])+'</b>':'…'; });
      }
      b.appendChild(p); t.appendChild(b);
    });
    body.appendChild(t);
  }
  d.appendChild(body);
  return {node:d, gaps:gapEls};
}

function taskScreen(){
  app.innerHTML='';
  var L=LEVELS[S.lv], D=L.doors[S.door], P=D.parts[S.part];
  var head=el('div','card');
  head.appendChild(el('div','eyebrow','Puerta '+(S.door+1)+' · '+esc(D.title)+(D.parts.length>1?' · Parte '+(S.part+1)+' de '+D.parts.length:'')));
  head.appendChild(el('h3',null,esc(P.instr)));
  app.appendChild(head);
  var gapEls=null;
  if(D.reading && P.type!=='cards'){
    var rb=readingBlock(D.reading, P.inReading?P:null, D);
    app.appendChild(rb.node); if(P.inReading) gapEls=rb.gaps;
  }
  var box=el('div','card'); app.appendChild(box);
  var api;
  if(P.type==='choice') api=renderChoice(box,P);
  else if(P.type==='cards') api=renderCards(box,P);
  else if(P.type==='type') api=renderType(box,P);
  else if(P.type==='gaps') api=renderGaps(box,P,gapEls);
  else if(P.type==='order') api=renderOrder(box,P);
  showAccents(P.type==='type'||P.type==='gaps');

  var fbl=el('div','fb-line'); box.appendChild(fbl);
  var hintBox=el('div','hintbox hidden'); box.appendChild(hintBox);
  var acts=el('div','actions'); box.appendChild(acts);
  var chk=el('button','btn',P.type==='cards'?'Siguiente →':'Comprobar');
  acts.appendChild(chk);
  var hb=null;
  if(P.hint){ hb=el('button','btn ghost','💡 Pista'); acts.appendChild(hb);
    hb.onclick=function(){ if(!hintBox.classList.contains('hidden')) return; hintBox.innerHTML='<b>Pista:</b> '+esc(P.hint); hintBox.classList.remove('hidden'); S.hints++; save(); hb.disabled=true; };
  }
  var busy=false;
  chk.onclick=function(){
    if(busy) return; busy=true; setTimeout(function(){busy=false;},600);
    if(chk.dataset.next){ nextPart(); return; }
    var r=api.check();
    if(r.done){
      fbl.className='fb-line ok'; fbl.textContent=P.type==='cards'?'':'¡Perfecto! Todo correcto.';
      if(P.type==='cards'){ nextPart(); return; }
      chk.textContent='Continuar →'; chk.dataset.next='1'; if(hb) hb.disabled=true;
      showAccents(false);
    } else {
      if(P.type!=='cards') S.errors++; save();
      fbl.className='fb-line '+(r.warnOnly?'warn':'bad');
      fbl.textContent=r.msg;
    }
  };
  // Enter = comprobar
  box.addEventListener('keydown',function(e){ if(e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); chk.click(); } });
  if(gapEls) app.querySelector('.reading').addEventListener('keydown',function(e){ if(e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); chk.click(); } });
  drawDoors(); scrollTop();
}

/* ============================================================
   TIPOS DE TAREA
   ============================================================ */
function renderChoice(box,P){
  var wrap=el('div','items'), state=[];
  P.items.forEach(function(it,i){
    var row=el('div','item'); row.appendChild(el('div','q','<span class="num">'+(i+1)+'</span>'+esc(it.q)));
    var opts=el('div','opts'); var list=it.opts||P.options;
    state[i]={sel:null,row:row,ok:false};
    list.forEach(function(o,k){
      var b=el('button','opt',esc(o)); b.type='button';
      b.onclick=function(){ if(state[i].ok) return; state[i].sel=k; [].forEach.call(opts.children,function(x){x.classList.remove('sel');}); b.classList.add('sel'); row.classList.remove('bad'); };
      opts.appendChild(b);
    });
    row.appendChild(opts); wrap.appendChild(row);
  });
  box.appendChild(wrap);
  return {check:function(){
    var missing=0, wrong=0;
    P.items.forEach(function(it,i){
      var s=state[i]; if(s.ok) return;
      if(s.sel===null){ missing++; return; }
      if(s.sel===it.a){ s.ok=true; s.row.classList.remove('bad'); s.row.classList.add('ok'); }
      else { wrong++; s.row.classList.add('bad'); }
    });
    if(missing) return {done:false,msg:'Te faltan '+missing+' respuesta'+(missing>1?'s':'')+'.'};
    if(wrong) return {done:false,msg:'Hay '+wrong+' respuesta'+(wrong>1?'s':'')+' incorrecta'+(wrong>1?'s':'')+'. ¡Inténtalo otra vez!'};
    return {done:true};
  }};
}

function renderCards(box,P){
  var g=el('div','cards'), seen=0, total=P.cards.length;
  P.cards.forEach(function(cd){
    var f=el('button','flip'); f.type='button';
    var inn=el('div','in');
    var fr=el('div','face front'); fr.appendChild(pic(cd.img,cd.emoji)); fr.appendChild(el('div','w',esc(cd.art+' '+cd.main)));
    var bk=el('div','face back'); bk.appendChild(el('div','w',esc(cd.art+' '+cd.main))); bk.appendChild(el('p',null,esc(cd.back)));
    inn.appendChild(fr); inn.appendChild(bk); f.appendChild(inn);
    f.onclick=function(){ f.classList.toggle('on'); if(!f.dataset.s){ f.dataset.s=1; f.classList.add('seen'); seen++; } };
    g.appendChild(f);
  });
  box.appendChild(g);
  return {check:function(){
    if(seen<total) return {done:false,warnOnly:true,msg:'Dale la vuelta a todas las tarjetas ('+seen+'/'+total+').'};
    return {done:true};
  }};
}

function renderType(box,P){
  var g=el('div','tgrid'), rows=[];
  shuffle(P.items).forEach(function(it){
    var c=el('div','titem');
    if(P.showImg) c.appendChild(pic(it.img,it.emoji));
    if(P.showClue) c.appendChild(el('div','clue',esc(it.back)));
    if(P.showPat) c.appendChild(el('div','pat',esc(it.art+'  '+pattern(it.main.toLowerCase()))));
    var a=el('div','ans'); a.appendChild(el('span','art',esc(it.art)));
    var inp=mkInput('txt'); if(P.showFirst) inp.placeholder=it.main.charAt(0).toLowerCase()+'…';
    a.appendChild(inp); c.appendChild(a);
    var note=el('div','note'); c.appendChild(note);
    inp.addEventListener('input',function(){ if(!c.classList.contains('ok')){ c.classList.remove('bad','warn'); note.textContent=''; } });
    rows.push({it:it,c:c,inp:inp,note:note,ok:false});
    g.appendChild(c);
  });
  box.appendChild(g);
  return {check:function(){
    var bad=0,warn=0,empty=0;
    rows.forEach(function(r){
      if(r.ok) return;
      if(!norm(r.inp.value)){ empty++; return; }
      var j=judge(r.inp.value,[r.it.main].concat(r.it.alts),true);
      r.c.classList.remove('bad','warn');
      if(j==='ok'){ r.ok=true; r.c.classList.add('ok'); r.inp.disabled=true; r.note.textContent=''; }
      else if(j==='warn'){ warn++; r.c.classList.add('warn'); r.note.className='note warn'; r.note.textContent='¡Casi! Revisa la tilde o la ñ.'; }
      else { bad++; r.c.classList.add('bad'); r.note.className='note bad'; r.note.textContent='No es correcto.'; }
    });
    if(empty) return {done:false,msg:'Te faltan '+empty+' palabra'+(empty>1?'s':'')+'.'};
    if(bad||warn) return {done:false,warnOnly:!bad,msg:bad?('Hay '+(bad+warn)+' palabra'+((bad+warn)>1?'s':'')+' por corregir.'):'¡Casi! Solo faltan tildes.'};
    return {done:true};
  }};
}

function fillGaps(container, src, P, list){
  var parts=src.split(/\[\[(\d+)\]\]/);
  for(var i=0;i<parts.length;i++){
    if(i%2===0){ container.appendChild(document.createTextNode(parts[i])); continue; }
    var n=+parts[i], G=P.gaps[n];
    var span=el('span','gap');
    var longest=G.a.reduce(function(m,x){return Math.max(m,x.length);},0);
    var inp=mkInput(null, Math.max(7,longest+3)+'ch');
    span.appendChild(el('span','n',String(n+1)));
    span.appendChild(inp); span.appendChild(el('span','inf','('+esc(G.inf)+')'));
    inp.addEventListener('input',function(){ if(!this.parentNode.classList.contains('ok')) this.parentNode.classList.remove('bad','warn'); });
    container.appendChild(span);
    list[n]={span:span,inp:inp,G:G,ok:false};
  }
}
function renderGaps(box,P,external){
  var list=external;
  if(!list){
    list=[];
    if(P.img){ var w=el('div','rimg'); w.style.maxWidth='420px'; w.style.margin='0 auto 14px'; var pp=pic(P.img,P.emoji); pp.style.aspectRatio='4/3'; w.appendChild(pp); box.appendChild(w); }
    var t=el('div','gaptext');
    var tmp=document.createElement('div'); tmp.innerHTML=P.html;
    [].forEach.call(tmp.children,function(node){
      var p=el(node.tagName.toLowerCase()); fillGaps(p,node.textContent,P,list); t.appendChild(p);
    });
    box.appendChild(t);
  } else {
    box.appendChild(el('p','small','Escribe en los huecos de los textos de arriba ↑'));
  }
  return {check:function(){
    var bad=0,warn=0,empty=0;
    list.forEach(function(r){
      if(r.ok) return;
      if(!norm(r.inp.value)){ empty++; return; }
      var j=judge(r.inp.value,r.G.a,false);
      r.span.classList.remove('bad','warn');
      if(j==='ok'){ r.ok=true; r.span.classList.add('ok'); r.inp.disabled=true; }
      else if(j==='warn'){ warn++; r.span.classList.add('warn'); }
      else { bad++; r.span.classList.add('bad'); }
    });
    if(empty) return {done:false,msg:'Te faltan '+empty+' hueco'+(empty>1?'s':'')+'.'};
    if(bad||warn){
      var m=[]; if(bad) m.push(bad+' incorrecto'+(bad>1?'s':'')+' (en rojo)'); if(warn) m.push(warn+' con la tilde mal (en amarillo)');
      return {done:false,warnOnly:!bad,msg:'Revisa: '+m.join(' y ')+'.'};
    }
    return {done:true};
  }};
}

function renderOrder(box,P){
  var seq=el('div','seq'), pool=el('div','pool');
  var correct=P.items.slice(), locked=0;
  box.appendChild(el('div','small','Tu orden:')); box.appendChild(seq);
  box.appendChild(el('div','small','Frases:')); box.appendChild(pool);
  function mk(text){
    var b=el('button','chip'); b.type='button'; b.innerHTML='<span class="k"></span><span>'+esc(text)+'</span>'; b.dataset.t=text;
    b.onclick=function(){
      if(b.classList.contains('ok')) return;
      if(b.parentNode===pool) seq.appendChild(b); else pool.appendChild(b);
      renum();
    };
    return b;
  }
  function renum(){ [].forEach.call(seq.children,function(x,i){ x.querySelector('.k').textContent=(i+1)+'.'; }); [].forEach.call(pool.children,function(x){ x.querySelector('.k').textContent='•'; }); }
  var sh=shuffle(correct); if(sh.join('|')===correct.join('|')) sh.reverse();
  sh.forEach(function(t){ pool.appendChild(mk(t)); }); renum();
  return {check:function(){
    if(pool.children.length) return {done:false,msg:'Coloca todas las frases primero.'};
    var kids=[].slice.call(seq.children), wrong=[];
    kids.forEach(function(k,i){ if(k.dataset.t===correct[i]) k.classList.add('ok'); else wrong.push(k); });
    if(!wrong.length) return {done:true};
    // las que están bien se quedan; las demás vuelven a las frases
    wrong.forEach(function(k){ k.classList.add('flash'); });
    setTimeout(function(){
      // las bien colocadas al principio, en su sitio
      var keep=kids.filter(function(k){return k.classList.contains('ok');});
      seq.innerHTML='';
      var firstWrong=kids.findIndex(function(k){return !k.classList.contains('ok');});
      kids.forEach(function(k,i){
        if(i<firstWrong){ seq.appendChild(k); }
        else { k.classList.remove('ok','flash'); pool.appendChild(k); }
      });
      renum();
    },450);
    var good=0; while(good<kids.length && kids[good].dataset.t===correct[good]) good++;
    return {done:false,msg: good===0 ? 'La primera frase no es correcta. ¡Inténtalo otra vez!' : (good===1 ? 'La primera frase está bien. Ordena las demás.' : 'Las primeras '+good+' frases están bien. Ordena las demás.')};
  }};
}

/* ============================================================
   ROUTER
   ============================================================ */
function route(){
  if(!S){ startScreen(); drawDoors(); return; }
  if(S.phase==='story') return storyScreen();
  if(S.phase==='task') return taskScreen();
  if(S.phase==='unlock') return unlockScreen();
  if(S.phase==='final') return finalScreen();
  if(S.phase==='done') return doneScreen();
  startScreen();
}
S=load();
if(S && !LEVELS[S.lv]) { S=null; clearState(); }
route(); drawDoors();
});
